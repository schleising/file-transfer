[workspace]
resolver = "2"
members = [
    "crates/ft-store",
    "crates/ft-exec",
    "crates/ft-mdns",
    "crates/ft-app",
]
default-members = ["crates/ft-app"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Steve"]

[workspace.dependencies]
ft-store = { path = "crates/ft-store" }
ft-exec = { path = "crates/ft-exec" }
ft-mdns = { path = "crates/ft-mdns" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
dioxus = { version = "0.8.0-alpha.1", features = ["desktop"] }
futures-timer = "3.0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4"] }
